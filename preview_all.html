<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Preview - 3 TVs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #94a3b8;
        }

        .tv-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            flex: 1;
        }

        .tv-container {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }

        .tv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .tv-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: #e2e8f0;
        }

        .tv-badge {
            background: #3b82f6;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            /* 16:9 Aspect Ratio */
            padding-bottom: 56.25%; 
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #0f172a;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            transform-origin: top left;
            border: none;
        }
        
        /* Responsive scaling */
        @media (max-width: 1500px) {
            .tv-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Vue Globale du Menu</h1>
        <p id="project-name-display">Chargement...</p>
    </div>

    <div class="tv-grid">
        <!-- TV 1 -->
        <div class="tv-container">
            <div class="tv-header">
                <div class="tv-title">Écran Gauche</div>
                <div class="tv-badge">TV 1</div>
            </div>
            <div class="iframe-wrapper" id="wrap-1">
                <iframe id="iframe-1" src=""></iframe>
            </div>
        </div>

        <!-- TV 2 -->
        <div class="tv-container">
            <div class="tv-header">
                <div class="tv-title">Écran Centre</div>
                <div class="tv-badge">TV 2</div>
            </div>
            <div class="iframe-wrapper" id="wrap-2">
                <iframe id="iframe-2" src=""></iframe>
            </div>
        </div>

        <!-- TV 3 -->
        <div class="tv-container">
            <div class="tv-header">
                <div class="tv-title">Écran Droite</div>
                <div class="tv-badge">TV 3</div>
            </div>
            <div class="iframe-wrapper" id="wrap-3">
                <iframe id="iframe-3" src=""></iframe>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const project = urlParams.get('project') || 'default';
            
            document.getElementById('project-name-display').textContent = `Projet: ${project.toUpperCase()}`;
            
            const tvs = [1, 2, 3];
            
            tvs.forEach(tvId => {
                const iframe = document.getElementById(`iframe-${tvId}`);
                iframe.src = `viewer.html?project=${project}&tv=${tvId}`;
                
                // Scale the iframe to fit the wrapper
                function resizeIframe() {
                    const wrapper = document.getElementById(`wrap-${tvId}`);
                    const wrapperWidth = wrapper.clientWidth;
                    const scale = wrapperWidth / 1920;
                    iframe.style.transform = `scale(${scale})`;
                }
                
                window.addEventListener('resize', resizeIframe);
                // Initial resize with a slight delay to ensure wrapper is rendered
                setTimeout(resizeIframe, 100);
            });
        });
    </script>
</body>
</html>
