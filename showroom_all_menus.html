    <!-- LIVE VIEWPORT -->
    <main class="flex-1 relative bg-black">
        <iframe id="showroom-frame" src="menu_cinema_ultra_master.html"></iframe>
    </main>

    <script>
        function switchMenu(url, btnEl, title, desc) {
            document.querySelectorAll('.tab-menu-btn').forEach(b => {
                b.className = "tab-menu-btn px-3 py-1.5 rounded-xl text-xs font-black bg-white/5 hover:bg-white/10 text-gray-300 border border-white/10 flex items-center gap-1.5 cursor-pointer";
            });
            btnEl.className = "tab-menu-btn active px-3 py-1.5 rounded-xl text-xs font-black bg-white/5 text-gray-200 border border-white/10 flex items-center gap-1.5 cursor-pointer";
            
            const frame = document.getElementById('showroom-frame');
            frame.src = url;
            
            const fsBtn = document.getElementById('btn-fullscreen-link');
            fsBtn.href = url;

            const badge = document.getElementById('current-menu-badge');
            if (badge) badge.innerText = "Menu Actuel : " + title;
        }
    </script>
