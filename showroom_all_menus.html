    <script>
        let currentMenuUrl = 'menu_concept12_street_pop.html';
        let currentMenuTitle = '⚡ Concept 12 : Canva Motion 2026 (Animation Séquentielle)';

        function switchMenu(url, btnEl, title) {
            currentMenuUrl = url;
            currentMenuTitle = title;

            document.querySelectorAll('.tab-menu-btn').forEach(b => {
                b.className = "tab-menu-btn px-3.5 py-1.5 rounded-xl text-xs font-black bg-white/5 hover:bg-white/10 text-gray-300 border border-white/10 flex items-center gap-1.5 cursor-pointer";
            });
            btnEl.className = "tab-menu-btn active px-3.5 py-1.5 rounded-xl text-xs font-black bg-white/5 text-gray-200 border border-white/10 flex items-center gap-1.5 cursor-pointer";

            const frame = document.getElementById('main-menu-frame');
            frame.src = url;

            const fsBtn = document.getElementById('btn-fullscreen-link');
            if (fsBtn) fsBtn.href = url;

            const dlBtn = document.getElementById('btn-download-menu');
            if (dlBtn) {
                dlBtn.href = url;
                dlBtn.setAttribute('download', url);
            }

            const badge = document.getElementById('current-menu-badge');
            if (badge) {
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Menu Actuel : ${title}`;
            }
        }

        function reloadFrame() {
            const frame = document.getElementById('main-menu-frame');
            if (frame) frame.src = frame.src;
        }

        function getFullCurrentUrl() {
            return window.location.origin + '/' + currentMenuUrl;
        }

        function copyCurrentMenuLink() {
            const fullUrl = getFullCurrentUrl();
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(fullUrl).then(() => {
                    showShowroomToast('✓ Lien copié : ' + fullUrl);
                }).catch(() => {
                    prompt('Copiez le lien direct de ce menu :', fullUrl);
                });
            } else {
                prompt('Copiez le lien direct de ce menu :', fullUrl);
            }
        }

        function openQRModal() {
            const fullUrl = getFullCurrentUrl();
            const qrImg = document.getElementById('qr-img');
            const qrInput = document.getElementById('qr-url-input');
            const qrTitle = document.getElementById('qr-menu-title');
            const qrModal = document.getElementById('qr-modal');

            if (qrTitle) qrTitle.textContent = currentMenuTitle;
            if (qrInput) qrInput.value = fullUrl;
            if (qrImg) qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(fullUrl)}`;
            if (qrModal) qrModal.style.display = 'flex';
        }

        function closeQRModal() {
            const qrModal = document.getElementById('qr-modal');
            if (qrModal) qrModal.style.display = 'none';
        }

        function copyQRUrl() {
            const fullUrl = getFullCurrentUrl();
            navigator.clipboard.writeText(fullUrl);
            showShowroomToast('✓ Lien copié dans le presse-papier !');
        }

        function showShowroomToast(msg) {
            const toast = document.getElementById('showroom-toast');
            const toastMsg = document.getElementById('showroom-toast-msg');
            if (!toast) return;
            if (toastMsg) toastMsg.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-8');
            toast.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-8');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        }
    </script>

    <!-- Showroom Toast Notification -->
    <div id="showroom-toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 -translate-y-8 opacity-0 pointer-events-none bg-emerald-500 text-white font-bold text-xs md:text-sm px-6 py-2.5 rounded-full shadow-2xl transition-all duration-300 z-50 flex items-center gap-2">
