<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Bocadillo TV Live Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        }

        #tv-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }

        /* Remote Feedback Overlay */
        #tv-toast {
            position: fixed;
            top: 36px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.94);
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            padding: 14px 34px;
            border-radius: 40px;
            border: 2px solid #ff6b00;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 107, 0, 0.35);
            z-index: 999999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        #tv-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(5px);
        }

        /* Setup Modal for Initial Android TV Boot */
        #tv-setup-modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 15, 0.94);
            backdrop-filter: blur(14px);
            z-index: 999998;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        #tv-setup-modal.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .setup-box {
            background: linear-gradient(145deg, #131926, #0b0f19);
            border: 2px solid #ff6b00;
            border-radius: 28px;
            padding: 40px 50px;
            max-width: 820px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 107, 0, 0.25);
        }

        .setup-title {
            font-size: 30px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .setup-subtitle {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .setup-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 24px;
        }

        .setup-btn {
            background: #1e293b;
            border: 2px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            border-radius: 20px;
            padding: 24px 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }

        .setup-btn:hover, .setup-btn:focus {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .setup-btn.tv1 { border-color: #f59e0b; }
        .setup-btn.tv1:hover { background: rgba(245, 158, 11, 0.2); }
        .setup-btn.tv2 { border-color: #f97316; }
        .setup-btn.tv2:hover { background: rgba(249, 115, 22, 0.2); }
        .setup-btn.tv3 { border-color: #3b82f6; }
        .setup-btn.tv3:hover { background: rgba(59, 130, 246, 0.2); }

        .setup-key-badge {
            display: inline-block;
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 8px;
            font-family: monospace;
        }

        .setup-label {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .setup-desc {
            font-size: 12px;
            color: #94a3b8;
        }

        .setup-auto-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            border-radius: 14px;
            padding: 12px 28px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .setup-auto-btn:hover {
            border-color: #ff6b00;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Notification Toast -->
    <div id="tv-toast">📺 Initialisation...</div>

    <!-- First-Time On-Screen TV Setup Modal -->
    <div id="tv-setup-modal" class="hidden">
        <div class="setup-box">
            <div class="setup-title">📺 CONFIGURATION DE CET ÉCRAN TV</div>
            <div class="setup-subtitle">
                Choisissez quelle position occupe cette télévision dans votre restaurant.<br>
                <strong style="color:#ff6b00;">Appuyez sur la touche [1], [2] ou [3] de votre télécommande :</strong>
            </div>

            <div class="setup-grid">
                <button onclick="setAssignedTv('1')" class="setup-btn tv1">
                    <div class="setup-key-badge" style="color:#fbbf24;">[ 1 ]</div>
                    <div class="setup-label">TV 1 (Gauche)</div>
                    <div class="setup-desc">Menu Bocadillos Chamali</div>
                </button>
                <button onclick="setAssignedTv('2')" class="setup-btn tv2">
                    <div class="setup-key-badge" style="color:#fb923c;">[ 2 ]</div>
                    <div class="setup-label">TV 2 (Centre)</div>
                    <div class="setup-desc">Menu Sandwiches Chauds</div>
                </button>
                <button onclick="setAssignedTv('3')" class="setup-btn tv3">
                    <div class="setup-key-badge" style="color:#60a5fa;">[ 3 ]</div>
                    <div class="setup-label">TV 3 (Droite)</div>
                    <div class="setup-desc">Menu Vibrant & Boissons</div>
                </button>
            </div>

            <button onclick="setAssignedTv('auto')" class="setup-auto-btn">
                [ 0 ] Mode Boucle Automatique (Tous les Menus en Rotation 15s)
            </button>
        </div>
    </div>

    <iframe id="tv-frame" src="about:blank" allow="fullscreen"></iframe>

    <script>
        // Preset URL mapping for models and screens
                const URL_PRESETS = {
            // 10 Brand New Creative Concepts with Motion Backgrounds
            'concept1_wood': 'menu_concept1_wood_atelier.html?mode=tv&screen=1',
            'concept2_sky': 'menu_concept2_sky_terrace.html?mode=tv&screen=1',
            'concept3_hero': 'menu_concept3_hero_spotlight.html?mode=tv&screen=1',
            'concept4_chalk': 'menu_concept4_chalkboard_bistro.html?mode=tv&screen=1',
            'concept5_fire': 'menu_concept5_fire_grill.html?mode=tv&screen=1',
            'concept6_bento': 'menu_concept6_conveyor_bento.html?mode=tv&screen=1',
            'concept7_gold': 'menu_concept7_gold_luxury.html?mode=tv&screen=1',
            'concept8_neon': 'menu_concept8_neon_arcade.html?mode=tv&screen=1',
            'concept9_truck': 'menu_concept9_food_truck.html?mode=tv&screen=1',
            'concept10_ticker': 'menu_concept10_broadcast_ticker.html?mode=tv&screen=1',
            
            // 8 Grand Brand Fast Food Models
            'model1_s1': 'menu_model1_emirates.html?mode=tv&screen=1',
            'model1_s2': 'menu_model1_emirates.html?mode=tv&screen=2',
            'model2_s1': 'menu_model2_urban.html?mode=tv&screen=1',
            'model2_s2': 'menu_model2_urban.html?mode=tv&screen=2',
            'model3_all': 'menu_model3_vibrant.html?mode=tv',
            'model4_shakeshack': 'menu_model4_shakeshack.html?mode=tv&screen=1',
            'model5_fiveguys': 'menu_model5_fiveguys.html?mode=tv&screen=1',
            'model6_chipotle': 'menu_model6_chipotle.html?mode=tv&screen=1',
            'model7_gold': 'menu_model7_gold_steakhouse.html?mode=tv&screen=1',
            'model8_cyber': 'menu_model8_cyber_neon.html?mode=tv&screen=1',
            'model1_auto': 'menu_model1_emirates.html?mode=tv',
            'model2_auto': 'menu_model2_urban.html?mode=tv',
            'model3_auto': 'menu_model3_vibrant.html?mode=tv'
        };

        const DEFAULT_TV_URLS = {
            '1': 'menu_model1_emirates.html?mode=tv&screen=1',
            '2': 'menu_model1_emirates.html?mode=tv&screen=2',
            '3': 'menu_model3_vibrant.html?mode=tv',
            'auto': 'menu_model1_emirates.html?mode=tv'
        };

        const frame = document.getElementById('tv-frame');
        const toast = document.getElementById('tv-toast');
        const setupModal = document.getElementById('tv-setup-modal');

        let tvConfigRemote = null;

        function showNotification(text) {
            toast.innerText = text;
            toast.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // 1. Resolve Assigned TV ID
        const urlParams = new URLSearchParams(window.location.search);
        let assignedTv = urlParams.get('tv') || localStorage.getItem('MENU_TV_ASSIGNED_ID');

        function resolveTargetUrl(tvId) {
            // Check if remote config has an explicit target_url
            if (tvConfigRemote && tvConfigRemote[tvId]) {
                const cfg = tvConfigRemote[tvId];
                if (cfg.target_url) return cfg.target_url;
                if (cfg.option_id && URL_PRESETS[cfg.option_id]) return URL_PRESETS[cfg.option_id];
            }
            return DEFAULT_TV_URLS[tvId] || DEFAULT_TV_URLS['auto'];
        }

        function loadAssignedScreen() {
            if (!assignedTv) {
                // Show on-screen remote picker if unassigned
                setupModal.classList.remove('hidden');
                // Temporarily load auto-loop in background
                frame.src = DEFAULT_TV_URLS['auto'];
                return;
            }

            setupModal.classList.add('hidden');
            const target = resolveTargetUrl(assignedTv);
            if (!frame.src.endsWith(target)) {
                frame.src = target;
            }
        }

        function setAssignedTv(id) {
            assignedTv = id;
            if (id === 'auto') {
                localStorage.removeItem('MENU_TV_ASSIGNED_ID');
                showNotification('🔄 Mode Boucle Automatique (Rotation 15s)');
            } else {
                localStorage.setItem('MENU_TV_ASSIGNED_ID', id);
                const names = {
                    '1': 'TV 1 (Gauche) : Bocadillos Chamali',
                    '2': 'TV 2 (Centre) : Sandwiches Chauds',
                    '3': 'TV 3 (Droite) : Vibrant / Extras'
                };
                showNotification('✅ CONFIGURÉ : ' + (names[id] || 'TV ' + id));
            }
            loadAssignedScreen();
        }

        // 2. Remote Control Keydown Switcher (1, 2, 3, 0)
        window.addEventListener('keydown', (e) => {
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;

            if (e.key === '1') {
                setAssignedTv('1');
            } else if (e.key === '2') {
                setAssignedTv('2');
            } else if (e.key === '3') {
                setAssignedTv('3');
            } else if (e.key === '0' || e.key === 'a' || e.key === 'A') {
                setAssignedTv('auto');
            } else if (e.key === 'c' || e.key === 'C' || e.key === 'm' || e.key === 'M') {
                // Press 'C' or 'M' to re-open setup modal
                setupModal.classList.toggle('hidden');
            }
        });

        // 3. Instant 0ms Cross-Tab Sync via BroadcastChannel
        try {
            const channel = new BroadcastChannel('MENU_TV_CHANNEL');
            channel.onmessage = (event) => {
                if (event.data && event.data.type === 'TV_CONFIG_UPDATE') {
                    tvConfigRemote = event.data.tv_config;
                    showNotification('⚡ Mise à jour Dashboard reçue en direct !');
                    loadAssignedScreen();
                }
            };
        } catch(e) {}

        // 4. Remote Sync via /api/menu_items & menu_items.json
        async function fetchTvFleetConfig() {
            try {
                let res = await fetch('/api/menu_items?t=' + Date.now());
                if (!res.ok) {
                    res = await fetch('menu_items.json?t=' + Date.now());
                }
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.tv_config) {
                        const newConfigStr = JSON.stringify(data.tv_config);
                        const oldConfigStr = JSON.stringify(tvConfigRemote);
                        if (newConfigStr !== oldConfigStr) {
                            tvConfigRemote = data.tv_config;
                            loadAssignedScreen();
                        }
                    }
                }
            } catch(e) {}
        }

        // Initial fetch and start polling
        fetchTvFleetConfig().then(loadAssignedScreen);
        setInterval(fetchTvFleetConfig, 15000);
    </script>
</body>
</html>
