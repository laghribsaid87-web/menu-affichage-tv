<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Bocadillo TV Live Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        #tv-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe id="tv-frame" src="menu_model1_emirates.html?mode=tv" allow="fullscreen"></iframe>

    <script>
        const models = {
            '1': 'menu_model1_emirates.html?mode=tv',
            '2': 'menu_model2_urban.html?mode=tv',
            '3': 'menu_model3_vibrant.html?mode=tv'
        };

        const frame = document.getElementById('tv-frame');

        // 1. Initial Model Resolution (URL > LocalStorage > Default: 1)
        const urlParams = new URLSearchParams(window.location.search);
        let currentModel = urlParams.get('model') || localStorage.getItem('MENU_TV_ACTIVE_MODEL') || '1';
        
        if (models[currentModel]) {
            frame.src = models[currentModel];
        }

        // 2. Auto-sync Model & Dynamic Settings from Backend / GitHub
        async function checkActiveModel() {
            try {
                // Try API first, fallback to static json
                let res = await fetch('/api/menu_items?t=' + Date.now());
                if (!res.ok) {
                    res = await fetch('menu_items.json?t=' + Date.now());
                }
                
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.global_settings && data.global_settings.active_model) {
                        const newModel = data.global_settings.active_model.toString();
                        if (newModel !== currentModel && models[newModel]) {
                            console.log("Switching TV Model to:", newModel);
                            currentModel = newModel;
                            localStorage.setItem('MENU_TV_ACTIVE_MODEL', newModel);
                            frame.src = models[newModel];
                        }
                    }
                }
            } catch(e) {
                // Offline mode: perfectly fine, keeps playing currentModel
            }
        }

        // Poll every 3 seconds for design or model switches
        checkActiveModel();
        setInterval(checkActiveModel, 3000);
    </script>
</body>
</html>
