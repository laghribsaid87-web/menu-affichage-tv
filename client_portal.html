<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                    <i class="fa-solid fa-satellite-dish mr-2"></i> Signage Admin Portal
                </h1>
                <p class="text-slate-400 mt-2">Gérez vos clients et vos écrans d'affichage dynamique.</p>
            </div>
            <button onclick="createNewProject()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-bold transition-all shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-plus mr-2"></i> Nouveau Client / Projet
            </button>
        </header>

        <div id="loading" class="text-center py-20">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500"></i>
            <p class="mt-4 text-slate-400">Chargement des projets...</p>
        </div>

        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Project Cards will be injected here -->
        </div>
    </div>

    <script>
        async function fetchProjects() {
            try {
                const res = await fetch('/api/projects');
                const data = await res.json();
                
                const grid = document.getElementById('projects-grid');
                grid.innerHTML = '';
                
                // Le serveur renvoie probablement un dictionnaire { "default": "Menu Principal", "video": "Menu Video" }
                let projects = [];
                if (Array.isArray(data)) {
                    projects = data;
                } else {
                    projects = Object.keys(data).map(key => ({ id: key, name: data[key] }));
                }

                if (projects.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center text-slate-500 py-10">Aucun projet trouvé.</div>';
                }

                projects.forEach(proj => {
                    const baseUrl = window.location.origin;
                    const editorUrl = `${baseUrl}/dashboard.html?project=${proj.id}`;
                    const viewerUrl = `${baseUrl}/viewer.html?project=${proj.id}`;

                    const card = document.createElement('div');
                    card.className = 'glass-panel rounded-xl p-6 shadow-xl relative overflow-hidden group hover:border-blue-500/50 transition-all';
                    card.innerHTML = `
                        <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                            <i class="fa-solid fa-tv text-6xl"></i>
                        </div>
                        <h3 class="text-2xl font-bold mb-1">${proj.name}</h3>
                        <p class="text-slate-400 text-sm mb-6">ID Client: <span class="font-mono text-blue-400">${proj.id}</span></p>
                        
                        <div class="space-y-4">
                            <!-- Viewer Link -->
                            <div>
                                <label class="text-xs text-emerald-400 uppercase font-bold tracking-wider mb-1 block">
                                    <i class="fa-solid fa-play mr-1"></i> Lien pour la TV (Afficheur)
                                </label>
                                <div class="flex">
                                    <input type="text" readonly value="${viewerUrl}" class="w-full bg-slate-900 border border-slate-700 rounded-l px-3 py-2 text-sm text-slate-300 outline-none focus:border-emerald-500">
                                    <button onclick="copyToClipboard('${viewerUrl}', this)" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-r transition-colors" title="Copier le lien">
                                        <i class="fa-solid fa-copy"></i>
                                    </button>
                                    <a href="${viewerUrl}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 ml-1 rounded transition-colors text-white" title="Ouvrir la TV">
                                        <i class="fa-solid fa-external-link-alt"></i>
                                    </a>
                                </div>
                            </div>
                            
                            <!-- Editor Link -->
                            <div class="pt-2 border-t border-slate-700/50">
                                <label class="text-xs text-blue-400 uppercase font-bold tracking-wider mb-1 block">
                                    <i class="fa-solid fa-pen-ruler mr-1"></i> Lien pour l'Éditeur (Dashboard)
                                </label>
                                <div class="flex">
                                    <input type="text" readonly value="${editorUrl}" class="w-full bg-slate-900 border border-slate-700 rounded-l px-3 py-2 text-sm text-slate-300 outline-none focus:border-blue-500">
                                    <button onclick="copyToClipboard('${editorUrl}', this)" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-r transition-colors" title="Copier le lien">
                                        <i class="fa-solid fa-copy"></i>
                                    </button>
                                    <a href="${editorUrl}" target="_blank" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 ml-1 rounded transition-colors text-white" title="Ouvrir l'éditeur">
                                        <i class="fa-solid fa-external-link-alt"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                document.getElementById('loading').classList.add('hidden');
                grid.classList.remove('hidden');

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerHTML = '<div class="text-red-500"><i class="fa-solid fa-triangle-exclamation text-4xl mb-3"></i><br>Erreur de connexion au serveur</div>';
            }
        }

        function copyToClipboard(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const icon = btnElement.querySelector('i');
                icon.className = 'fa-solid fa-check text-emerald-400';
                setTimeout(() => {
                    icon.className = 'fa-solid fa-copy';
                }, 2000);
            });
        }

        function createNewProject() {
            alert("Pour ajouter un projet: Allez dans dashboard.html et modifiez l'URL avec ?project=nouveau_nom, puis sauvegardez !");
        }

        // Init
        window.addEventListener('DOMContentLoaded', fetchProjects);
    </script>
</body>
</html>
