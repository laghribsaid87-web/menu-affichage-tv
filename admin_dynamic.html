<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Menu Dynamic TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">

<div class="max-w-5xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
    <div class="flex justify-between items-center mb-8 border-b pb-4">
        <h1 class="text-3xl font-black text-red-600">🍔 Mon Bocadillo - Gestion TV</h1>
        <div>
            <a href="/tv_dynamic.html" target="_blank" class="bg-blue-600 text-white px-4 py-2 rounded font-bold hover:bg-blue-700 mr-2">Ouvrir TV</a>
            <button onclick="saveData()" class="bg-green-600 text-white px-6 py-2 rounded font-bold hover:bg-green-700 shadow-md transform hover:scale-105 transition">Sauvegarder</button>
        </div>
    </div>

    <div id="status" class="hidden mb-4 p-4 rounded text-white font-bold text-center"></div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Bocadillos Section -->
        <div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-gray-800">Nos Bocadillos</h2>
                <button onclick="addItem('bocadillos')" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded font-bold">+ Ajouter</button>
            </div>
            <div id="bocadillos-list" class="space-y-4">
                <!-- JS will inject here -->
            </div>
        </div>

        <!-- Sandwiches Section -->
        <div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-gray-800">Nos Sandwiches</h2>
                <button onclick="addItem('sandwiches')" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded font-bold">+ Ajouter</button>
            </div>
            <div id="sandwiches-list" class="space-y-4">
                <!-- JS will inject here -->
            </div>
        </div>
    </div>

    <!-- Design Settings Section -->
    <div class="mt-8 pt-8 border-t border-gray-300">
        <h2 class="text-3xl font-black text-gray-800 mb-6"><i class="fa fa-paint-brush mr-2 text-red-600"></i> Personnaliser le Design (Smart Theme)</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
                <h3 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">🍔 Sandwich Lkbir (Spotlight)</h3>
                
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Position X (Lissar/Limn)</label>
                    <input type="range" min="-300" max="300" id="set_spotlight_sandwich_x" oninput="updateSetting('spotlight_sandwich_x', this.value)" class="w-full cursor-pointer">
                    <div class="text-center font-mono text-sm font-bold text-blue-600"><span id="val_spotlight_sandwich_x">0</span> px</div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Position Y (Lfo9/Lta7t)</label>
                    <input type="range" min="-300" max="300" id="set_spotlight_sandwich_y" oninput="updateSetting('spotlight_sandwich_y', this.value)" class="w-full cursor-pointer">
                    <div class="text-center font-mono text-sm font-bold text-blue-600"><span id="val_spotlight_sandwich_y">0</span> px</div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Taille / Zoom (%)</label>
                    <input type="range" min="50" max="250" id="set_spotlight_sandwich_scale" oninput="updateSetting('spotlight_sandwich_scale', this.value)" class="w-full cursor-pointer">
                    <div class="text-center font-mono text-sm font-bold text-blue-600"><span id="val_spotlight_sandwich_scale">110</span> %</div>
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Animation Dakhla</label>
                    <select id="set_spotlight_anim" onchange="updateSetting('spotlight_anim', this.value)" class="w-full border-2 border-gray-300 p-2 rounded-lg font-bold">
                        <option value="pop">Pop 3D (Wa3ra)</option>
                        <option value="slide-up">Tle3 men lta7t</option>
                        <option value="slide-right">Dkhel men jnb</option>
                        <option value="zoom">Zoom</option>
                        <option value="fade">Ban bchwia (Fade)</option>
                    </select>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
                <h3 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">🍟 Frites (Spotlight)</h3>
                
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Position X (Lissar/Limn)</label>
                    <input type="range" min="-300" max="300" id="set_spotlight_fries_x" oninput="updateSetting('spotlight_fries_x', this.value)" class="w-full cursor-pointer">
                    <div class="text-center font-mono text-sm font-bold text-blue-600"><span id="val_spotlight_fries_x">0</span> px</div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Position Y (Lfo9/Lta7t)</label>
                    <input type="range" min="-300" max="300" id="set_spotlight_fries_y" oninput="updateSetting('spotlight_fries_y', this.value)" class="w-full cursor-pointer">
                    <div class="text-center font-mono text-sm font-bold text-blue-600"><span id="val_spotlight_fries_y">0</span> px</div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Taille / Zoom (%)</label>
                    <input type="range" min="50" max="250" id="set_spotlight_fries_scale" oninput="updateSetting('spotlight_fries_scale', this.value)" class="w-full cursor-pointer">
                    <div class="text-center font-mono text-sm font-bold text-blue-600"><span id="val_spotlight_fries_scale">100</span> %</div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    let menuData = { bocadillos: [], sandwiches: [] };


    async function loadData() {
        try {
            const res = await fetch('/api/dynamic_menu');
            menuData = await res.json();
            if(!menuData.bocadillos) menuData.bocadillos = [];
            if(!menuData.sandwiches) menuData.sandwiches = [];
            if(!menuData.settings) menuData.settings = {};
            renderLists();
            loadSettings();
        } catch (e) {
            console.error('Failed to load menu data', e);
        }
    }

    function loadSettings() {
        const s = menuData.settings;
        const keys = ['spotlight_sandwich_x', 'spotlight_sandwich_y', 'spotlight_sandwich_scale', 
                      'spotlight_fries_x', 'spotlight_fries_y', 'spotlight_fries_scale', 'spotlight_anim'];
        keys.forEach(k => {
            if(s[k] !== undefined) {
                const el = document.getElementById('set_' + k);
                if(el) el.value = s[k];
                const valEl = document.getElementById('val_' + k);
                if(valEl) valEl.innerText = s[k];
            }
        });
    }

    function updateSetting(key, value) {
        if(!menuData.settings) menuData.settings = {};
        const numVal = Number(value);
        menuData.settings[key] = isNaN(numVal) ? value : numVal;
        
        const valEl = document.getElementById('val_' + key);
        if(valEl) valEl.innerText = value;
    }


    function renderLists() {
        renderCategory('bocadillos', 'bocadillos-list');
        renderCategory('sandwiches', 'sandwiches-list');
    }

    function renderCategory(category, elementId) {
        const container = document.getElementById(elementId);
        container.innerHTML = '';
        menuData[category].forEach((item, index) => {
            const div = document.createElement('div');
            div.className = "bg-gray-50 border p-4 rounded-xl shadow-sm relative flex gap-4 items-center";
            div.innerHTML = `
                <img src="/${item.img}" class="w-20 h-20 object-contain rounded bg-white shadow" onerror="this.src='https://via.placeholder.com/80?text=IMG'">
                <div class="flex-1">
                    <label class="text-xs font-bold text-gray-500">Nom</label>
                    <input type="text" value="${item.name}" onchange="updateItem('${category}', ${index}, 'name', this.value)" class="w-full border p-2 rounded mb-2 font-bold">
                    
                    <div class="flex gap-2">
                        <div class="w-1/3">
                            <label class="text-xs font-bold text-gray-500">Prix (DH)</label>
                            <input type="text" value="${item.price}" onchange="updateItem('${category}', ${index}, 'price', this.value)" class="w-full border p-2 rounded text-red-600 font-bold">
                        </div>
                        <div class="w-2/3">
                            <label class="text-xs font-bold text-gray-500">Image Path</label>
                            <input type="text" value="${item.img}" onchange="updateItem('${category}', ${index}, 'img', this.value)" class="w-full border p-2 rounded text-sm text-gray-600">
                        </div>
                    </div>
                </div>
                <button onclick="removeItem('${category}', ${index})" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full font-bold flex justify-center items-center hover:bg-red-700 shadow">&times;</button>
            `;
            container.appendChild(div);
        });
    }

    function updateItem(category, index, field, value) {
        menuData[category][index][field] = value;
    }

    function addItem(category) {
        menuData[category].push({ name: "NOUVEAU PRODUIT", price: "0", img: "processed_images/placeholder.png" });
        renderLists();
    }

    function removeItem(category, index) {
        if(confirm('Supprimer ce produit ?')) {
            menuData[category].splice(index, 1);
            renderLists();
        }
    }

    async function saveData() {
        const btn = document.querySelector('button[onclick="saveData()"]');
        const oldText = btn.innerText;
        btn.innerText = "Sauvegarde...";
        
        try {
            const res = await fetch('/api/dynamic_menu', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(menuData)
            });
            if(res.ok) {
                showStatus('Menu sauvegardé avec succès !', 'bg-green-500');
            } else {
                showStatus('Erreur de sauvegarde.', 'bg-red-500');
            }
        } catch (e) {
            showStatus('Erreur réseau.', 'bg-red-500');
        }
        btn.innerText = oldText;
    }

    function showStatus(msg, bgClass) {
        const s = document.getElementById('status');
        s.innerText = msg;
        s.className = `mb-4 p-4 rounded text-white font-bold text-center block ${bgClass}`;
        setTimeout(() => { s.classList.add('hidden'); }, 3000);
    }

    // Init
    loadData();
</script>
</body>
</html>
