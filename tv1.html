<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV1 - Bocadillos Spécialités PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #FFFFFF;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            width: 1920px;
            height: 1080px;
            margin: 0;
            padding: 0;
            position: relative;
        }
        /* Dynamic Animated Background */
        .bg-gradient-anim {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(218,41,28,0.15) 0%, rgba(10,10,10,1) 40%);
            z-index: -2;
            animation: rotateBg 20s linear infinite;
        }
        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Noise Texture */
        .noise {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.3; z-index: -1; pointer-events: none;
        }
        
        h1, h2, h3, .price, .badge { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .yellow-accent { color: #FFC72C; }
        .red-accent { color: #DA291C; }
        
        .header-title {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 0;
        }
        
        /* Glassmorphism Card with Image Breakout */
        .pro-card {
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,199,44,0.15);
            border-left: 6px solid #FFC72C;
            border-radius: 20px;
            position: relative;
            margin-left: 60px; /* Space for image breakout */
            display: flex;
            align-items: center;
            height: 160px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        
        .pro-card .food-img-container {
            position: absolute;
            left: -80px;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(15px 15px 15px rgba(0,0,0,0.6));
        }
        
        .pro-card .food-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .pro-card .content {
            margin-left: 150px; /* Space for the absolute image */
            flex: 1;
            padding-right: 20px;
        }
        
        .pro-card .price-tag {
            background: #FFC72C;
            color: #111;
            padding: 10px 30px;
            border-radius: 30px 0 0 30px;
            font-size: 3.5rem;
            font-weight: 700;
            box-shadow: -5px 0 15px rgba(255,199,44,0.3);
            display: flex;
            align-items: baseline;
            gap: 5px;
        }
        
        .section-title {
            background: linear-gradient(90deg, #DA291C, transparent);
            padding: 10px 30px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 30px;
            margin-left: 60px;
            font-size: 3rem;
            box-shadow: 0 10px 20px rgba(218,41,28,0.3);
        }
    </style>
</head>
<body class="flex flex-col p-10">
    <div class="bg-gradient-anim"></div>
    <div class="noise"></div>
    
    <header class="text-center mb-10">
        <h1 class="header-title">BOCADILLOS <span class="yellow-accent">SPÉCIALITÉS</span></h1>
        <div class="w-64 h-2 bg-[#FFC72C] mx-auto mt-4 rounded-full shadow-[0_0_15px_#FFC72C]"></div>
    </header>

    <div class="flex-1 grid grid-cols-2 gap-x-16" id="menu-container">
        <!-- Thon Section -->
        <div class="flex flex-col gap-10 pt-4" id="thon-section">
            <h2 class="section-title">THON</h2>
            <div id="thon-items" class="flex flex-col gap-10"></div>
        </div>
        
        <!-- Tortilla Section -->
        <div class="flex flex-col gap-10 pt-4" id="tortilla-section">
            <h2 class="section-title" style="background: linear-gradient(90deg, #FFC72C, transparent); color: #111;">TORTILLA</h2>
            <div id="tortilla-items" class="flex flex-col gap-10"></div>
            
            <div class="mt-auto pro-card !border-l-[#DA291C] !border-l-8 !ml-0" style="height: 130px;">
                <div class="content !ml-8">
                    <h3 class="text-4xl font-bold text-[#FFC72C] mb-1 tracking-wide">SUPPLÉMENT FROMAGE</h3>
                    <p class="text-gray-300 text-2xl font-medium">Sur tous les bocadillos</p>
                </div>
                <div class="price-tag !bg-[#DA291C] !text-white !shadow-[-5px_0_15px_rgba(218,41,28,0.5)]">
                    +5 <span class="text-3xl">DH</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            const res = await fetch('menu_data.json');
            const data = await res.json();
            
            const createItem = (item) => `
                <div class="pro-card item-card">
                    <div class="food-img-container">
                        <img src="${item.image}" alt="${item.name}" class="food-img">
                    </div>
                    <div class="content">
                        <h3 class="text-4xl font-bold mb-1 tracking-wide">${item.name}</h3>
                        <p class="text-gray-300 text-xl font-medium">${item.description}</p>
                    </div>
                    <div class="price-tag">
                        ${item.price} <span class="text-3xl">DH</span>
                    </div>
                </div>
            `;

            document.getElementById('thon-items').innerHTML = data.bocadillosThon.map(createItem).join('');
            document.getElementById('tortilla-items').innerHTML = data.bocadillosTortilla.map(createItem).join('');

            // Advanced Entrance Animations
            gsap.from(".header-title", { y: -50, opacity: 0, duration: 1, ease: "expo.out" });
            gsap.from(".section-title", { x: -50, opacity: 0, duration: 1, stagger: 0.2, ease: "expo.out", delay: 0.3 });
            
            gsap.from(".item-card", {
                x: 100,
                opacity: 0,
                duration: 1.2,
                stagger: 0.1,
                ease: "expo.out",
                delay: 0.5
            });

            gsap.from(".food-img", {
                scale: 0,
                rotation: -15,
                duration: 1.2,
                stagger: 0.1,
                ease: "back.out(1.5)",
                delay: 0.7
            });

            // Continuous floating animation for food
            gsap.to(".food-img", {
                y: -12,
                duration: 2.5,
                repeat: -1,
                yoyo: true,
                ease: "sine.inOut",
                stagger: {
                    each: 0.2,
                    from: "random"
                }
            });
        }
        loadData();
    </script>
</body>
</html>
